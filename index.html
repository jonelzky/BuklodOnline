<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buklod Online - Talaan ng Benta</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- FIREBASE SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      onSnapshot, 
      query, 
      orderBy 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDS6vkoJAQUEpqJhTrSaG6-NZTYuA43FmU",
      authDomain: "buklod-online.firebaseapp.com",
      projectId: "buklod-online",
      storageBucket: "buklod-online.firebasestorage.app",
      messagingSenderId: "916118497940",
      appId: "1:916118497940:web:c0bfbb9c38f26b7520a281",
      measurementId: "G-JJF1L8K7RM"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.firestoreTools = {
      collection, onSnapshot, query, orderBy
    };
  </script>

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans text-base">

  <!-- HEADER (WALANG ADMIN LOCK/BUTTON) -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-30 shadow-md">
    <div class="max-w-3xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-3.5">
        <div class="w-12 h-12 rounded-xl overflow-hidden flex items-center justify-center bg-slate-900 border border-slate-700/60 shadow-lg p-0.5">
          <img src="https://res.cloudinary.com/sklsysfy/image/upload/v1793538521/bwmmgzvzddh9nfhv7fpi.png" alt="Buklod Online Logo" class="w-full h-full object-contain object-center">
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-wide">Buklod Online</h1>
          <p class="text-sm text-slate-300">Talaan ng Benta at Gastos</p>
        </div>
      </div>
    </div>

    <!-- TAB NAVIGATION -->
    <div class="max-w-3xl mx-auto px-4 mt-2 overflow-x-auto no-scrollbar flex gap-2 border-t border-slate-700/50 pt-2.5 pb-2 text-sm font-bold">
      <button onclick="switchTab('raw')" id="tab-raw" class="tab-btn bg-emerald-600 text-white px-4 py-2.5 rounded-xl whitespace-nowrap shadow-sm">Entry</button>
      <button onclick="switchTab('daily')" id="tab-daily" class="tab-btn bg-slate-700 text-slate-200 hover:bg-slate-600 px-4 py-2.5 rounded-xl whitespace-nowrap">Daily</button>
      <button onclick="switchTab('weekly')" id="tab-weekly" class="tab-btn bg-slate-700 text-slate-200 hover:bg-slate-600 px-4 py-2.5 rounded-xl whitespace-nowrap">Weekly</button>
      <button onclick="switchTab('monthly')" id="tab-monthly" class="tab-btn bg-slate-700 text-slate-200 hover:bg-slate-600 px-4 py-2.5 rounded-xl whitespace-nowrap">Monthly</button>
      <button onclick="switchTab('yearly')" id="tab-yearly" class="tab-btn bg-slate-700 text-slate-200 hover:bg-slate-600 px-4 py-2.5 rounded-xl whitespace-nowrap">Yearly</button>
    </div>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="max-w-3xl mx-auto w-full px-4 py-5 flex-1 space-y-5">

    <!-- SUMMARY CARDS -->
    <div class="grid grid-cols-3 gap-2.5">
      <div class="bg-slate-800 border border-slate-700/80 rounded-2xl p-3.5 shadow-sm">
        <div class="flex items-center justify-between mb-1.5">
          <span class="text-xs font-semibold text-slate-300">Total Benta</span>
          <i data-lucide="arrow-down-right" class="w-4 h-4 text-emerald-400"></i>
        </div>
        <p id="totalSales" class="text-base sm:text-xl font-black text-emerald-400">₱0.00</p>
      </div>

      <div class="bg-slate-800 border border-slate-700/80 rounded-2xl p-3.5 shadow-sm">
        <div class="flex items-center justify-between mb-1.5">
          <span class="text-xs font-semibold text-slate-300">Total Gastos</span>
          <i data-lucide="arrow-up-right" class="w-4 h-4 text-rose-400"></i>
        </div>
        <p id="totalExpenses" class="text-base sm:text-xl font-black text-rose-400">₱0.00</p>
      </div>

      <div class="bg-slate-800 border border-slate-700/80 rounded-2xl p-3.5 shadow-sm">
        <div class="flex items-center justify-between mb-1.5">
          <span class="text-xs font-semibold text-slate-300">Tubo (Net)</span>
          <i data-lucide="wallet" class="w-4 h-4 text-amber-400"></i>
        </div>
        <p id="netIncome" class="text-base sm:text-xl font-black text-amber-400">₱0.00</p>
      </div>
    </div>

    <!-- LIST HEADER -->
    <div class="flex items-center justify-between pt-2">
      <h2 id="viewTitle" class="text-base font-bold text-slate-200 flex items-center gap-2">
        <i data-lucide="list" class="w-5 h-5 text-emerald-500"></i>
        Talaan ng Benta
      </h2>
      <span id="itemCount" class="text-sm bg-slate-800 border border-slate-700 text-slate-300 px-3 py-1 rounded-full font-semibold">0 entries</span>
    </div>

    <!-- SIMPLE LIST CONTAINER -->
    <div id="ledgerList" class="space-y-3">
      <div class="text-center py-12 text-slate-400 text-base">
        Kumokonekta sa Firebase Firestore...
      </div>
    </div>
  </main>

  <!-- JAVASCRIPT LOGIC (VIEW-ONLY) -->
  <script>
    let currentTab = 'raw';
    let rawLedgerData = [];

    const monthNamesTagalog = ["Enero", "Pebryero", "Marso", "Abril", "Mayo", "Hunyo", "Hulyo", "Agosto", "Setyembre", "Oktubre", "Nobyembre", "Disyembre"];

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      setupFirestoreListener();
    });

    function setupFirestoreListener() {
      const interval = setInterval(() => {
        if (window.db && window.firestoreTools) {
          clearInterval(interval);
          const { collection, onSnapshot, query, orderBy } = window.firestoreTools;
          const q = query(collection(window.db, "talaan_entries"), orderBy("date", "desc"));
          
          onSnapshot(q, (snapshot) => {
            rawLedgerData = [];
            snapshot.forEach((doc) => {
              rawLedgerData.push({ id: doc.id, ...doc.data() });
            });
            renderLedgerList();
          }, (error) => {
            console.log("Firestore error:", error);
            renderLedgerList();
          });
        }
      }, 200);
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('bg-emerald-600', 'text-white');
        btn.classList.add('bg-slate-700', 'text-slate-200');
      });
      document.getElementById(`tab-${tab}`).classList.remove('bg-slate-700', 'text-slate-200');
      document.getElementById(`tab-${tab}`).classList.add('bg-emerald-600', 'text-white');
      renderLedgerList();
    }

    function formatDateReadable(dateStr) {
      const d = normalizeDate(dateStr);
      if (isNaN(d.getTime())) return dateStr;
      const m = monthNamesTagalog[d.getMonth()];
      return `${m} ${d.getDate()}, ${d.getFullYear()}`;
    }

    function normalizeDate(dateStr) {
      if (!dateStr) return new Date();
      const cleanStr = dateStr.includes('-') && dateStr.length === 10 ? dateStr + "T00:00:00" : dateStr;
      const d = new Date(cleanStr);
      if (isNaN(d.getTime())) return new Date();
      return d;
    }

    function getCleanWeekRange(dateStr) {
      const d = normalizeDate(dateStr);
      const day = d.getDay();
      const diffToMonday = d.getDate() - day + (day === 0 ? -6 : 1);
      const monday = new Date(new Date(d).setDate(diffToMonday));
      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);

      const mStart = monthNamesTagalog[monday.getMonth()];
      const mEnd = monthNamesTagalog[sunday.getMonth()];
      const year = sunday.getFullYear();

      if (monday.getMonth() === sunday.getMonth()) {
        return `${mStart} ${monday.getDate()}-${sunday.getDate()}, ${year}`;
      } else {
        return `${mStart} ${monday.getDate()} - ${mEnd} ${sunday.getDate()}, ${year}`;
      }
    }

    function isExpenseItem(item) {
      const typeStr = (item.type || '').toLowerCase();
      const rawAmt = parseFloat(item.amount) || 0;
      return typeStr === 'gastos' || 
             typeStr.includes('gastos') || 
             typeStr.includes('expense') || 
             typeStr.includes('expenses') || 
             typeStr.includes('bawas') || 
             typeStr.includes('labas') || 
             typeStr.includes('out') || 
             typeStr.includes('-') ||
             rawAmt < 0;
    }

    function renderLedgerList() {
      const container = document.getElementById('ledgerList');
      let displayItems = [];
      let grandTotalSales = 0;
      let grandTotalExpenses = 0;

      if (currentTab === 'raw') {
        displayItems = rawLedgerData.map(item => {
          const isExp = isExpenseItem(item);
          return {
            title: item.description || 'Item',
            sub: `${formatDateReadable(item.date)} ${item.time ? '• ' + item.time : ''}`,
            type: isExp ? 'gastos' : 'benta',
            amount: Math.abs(parseFloat(item.amount) || 0),
            id: item.id
          };
        });

      } else if (currentTab === 'daily') {
        const groups = {};
        rawLedgerData.forEach(item => {
          const dKey = item.date;
          if (!dKey) return;
          if (!groups[dKey]) groups[dKey] = { date: dKey, sales: 0, expenses: 0 };
          const amt = Math.abs(parseFloat(item.amount) || 0);
          if (isExpenseItem(item)) {
            groups[dKey].expenses += amt;
          } else {
            groups[dKey].sales += amt;
          }
        });

        displayItems = Object.keys(groups).sort().reverse().map(k => ({
          title: formatDateReadable(groups[k].date),
          sub: 'Kabuuang Araw',
          sales: groups[k].sales,
          expenses: groups[k].expenses,
          net: groups[k].sales - groups[k].expenses
        }));

      } else if (currentTab === 'weekly') {
        const groups = {};
        rawLedgerData.forEach(item => {
          const wLabel = getCleanWeekRange(item.date);
          if (!wLabel) return;
          if (!groups[wLabel]) groups[wLabel] = { label: wLabel, sales: 0, expenses: 0 };
          const amt = Math.abs(parseFloat(item.amount) || 0);
          if (isExpenseItem(item)) {
            groups[wLabel].expenses += amt;
          } else {
            groups[wLabel].sales += amt;
          }
        });

        displayItems = Object.keys(groups).sort().reverse().map(k => ({
          title: groups[k].label,
          sub: 'Buod ng Linggo',
          sales: groups[k].sales,
          expenses: groups[k].expenses,
          net: groups[k].sales - groups[k].expenses
        }));

      } else if (currentTab === 'monthly') {
        const groups = {};
        rawLedgerData.forEach(item => {
          const d = normalizeDate(item.date);
          const y = d.getFullYear();
          const m = d.getMonth();
          const mKey = `${y}-${String(m + 1).padStart(2, '0')}`;
          const mName = monthNamesTagalog[m] || '';
          const label = `${mName} ${y}`;

          if (!groups[mKey]) groups[mKey] = { label, sales: 0, expenses: 0 };
          const amt = Math.abs(parseFloat(item.amount) || 0);
          if (isExpenseItem(item)) {
            groups[mKey].expenses += amt;
          } else {
            groups[mKey].sales += amt;
          }
        });

        displayItems = Object.keys(groups).sort().reverse().map(k => ({
          title: groups[k].label,
          sub: 'Buod ng Buwan',
          sales: groups[k].sales,
          expenses: groups[k].expenses,
          net: groups[k].sales - groups[k].expenses
        }));

      } else if (currentTab === 'yearly') {
        const groups = {};
        rawLedgerData.forEach(item => {
          const d = normalizeDate(item.date);
          const yKey = d.getFullYear().toString();

          if (!groups[yKey]) groups[yKey] = { year: yKey, sales: 0, expenses: 0 };
          const amt = Math.abs(parseFloat(item.amount) || 0);
          if (isExpenseItem(item)) {
            groups[yKey].expenses += amt;
          } else {
            groups[yKey].sales += amt;
          }
        });

        displayItems = Object.keys(groups).sort().reverse().map(k => ({
          title: `Taon ${groups[k].year}`,
          sub: 'Buod ng Taon',
          sales: groups[k].sales,
          expenses: groups[k].expenses,
          net: groups[k].sales - groups[k].expenses
        }));
      }

      // Calculate Summary Card totals
      rawLedgerData.forEach(item => {
        const amt = Math.abs(parseFloat(item.amount) || 0);
        if (isExpenseItem(item)) {
          grandTotalExpenses += amt;
        } else {
          grandTotalSales += amt;
        }
      });

      document.getElementById('itemCount').textContent = `${displayItems.length} entries`;

      if (displayItems.length === 0) {
        container.innerHTML = `
          <div class="bg-slate-800/40 border border-slate-700/50 rounded-2xl p-8 text-center text-slate-400">
            <i data-lucide="inbox" class="w-10 h-10 mx-auto mb-2 opacity-50"></i>
            <p class="text-base font-semibold">Walang nahanap na tala.</p>
          </div>
        `;
        updateSummary(0, 0);
        return;
      }

      if (currentTab === 'raw') {
        container.innerHTML = displayItems.map(item => `
          <div class="bg-slate-800 border border-slate-700/80 rounded-2xl px-4 py-4 flex items-center justify-between shadow-sm">
            <div class="flex items-center gap-3.5">
              <div class="p-2.5 rounded-xl ${item.type === 'benta' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'}">
                <i data-lucide="${item.type === 'benta' ? 'trending-up' : 'trending-down'}" class="w-5 h-5"></i>
              </div>
              <div>
                <h3 class="text-sm sm:text-base font-bold text-slate-100">${escapeHtml(item.title)}</h3>
                <p class="text-xs sm:text-sm text-slate-300">${item.sub}</p>
              </div>
            </div>
            <div>
              <span class="text-base sm:text-lg font-black ${item.type === 'benta' ? 'text-emerald-400' : 'text-rose-400'}">
                ${item.type === 'benta' ? '+' : '-'}₱${item.amount.toLocaleString('en-US', {minimumFractionDigits: 2})}
              </span>
            </div>
          </div>
        `).join('');
      } else {
        container.innerHTML = displayItems.map(item => `
          <div class="bg-slate-800 border border-slate-700/80 rounded-2xl px-4 py-4 flex items-center justify-between shadow-sm">
            <div>
              <h3 class="text-sm sm:text-base font-bold text-slate-100">${escapeHtml(item.title)}</h3>
              <p class="text-xs sm:text-sm text-slate-300">${item.sub}</p>
            </div>
            <div class="text-right">
              <div class="text-xs sm:text-sm text-emerald-400 font-semibold">Benta: ₱${item.sales.toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
              ${item.expenses > 0 ? `<div class="text-xs sm:text-sm text-rose-400 font-semibold">Gastos: -₱${item.expenses.toLocaleString('en-US', {minimumFractionDigits: 2})}</div>` : ''}
              <div class="text-base sm:text-lg font-black text-amber-400 mt-1">
                Tubo: ₱${item.net.toLocaleString('en-US', {minimumFractionDigits: 2})}
              </div>
            </div>
          </div>
        `).join('');
      }

      updateSummary(grandTotalSales, grandTotalExpenses);
      lucide.createIcons();
    }

    function updateSummary(sales, expenses) {
      document.getElementById('totalSales').textContent = `₱${sales.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
      document.getElementById('totalExpenses').textContent = `₱${expenses.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
      document.getElementById('netIncome').textContent = `₱${(sales - expenses).toLocaleString('en-US', {minimumFractionDigits: 2})}`;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
