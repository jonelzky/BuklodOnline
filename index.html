<!DOCTYPE html>
<html lang="fil">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talaan ng Benta at Imbentaryo (Viewer)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'IBM Plex Mono', monospace; }
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; padding: 0 !important; }
        }
    </style>
</head>
<body class="bg-white text-gray-900 min-h-screen">

    <div id="root" class="w-full min-h-screen"></div>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- React at Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const firebaseConfig = {
            apiKey: "AIzaSyDS6vkoJAQUEpqJhTrSaG6-NZTYuA43FmU",
            authDomain: "buklod-online.firebaseapp.com",
            projectId: "buklod-online",
            storageBucket: "buklod-online.firebasestorage.app",
            messagingSenderId: "916118497940",
            appId: "1:916118497940:web:c0bfbb9c38f26b7520a281"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        const MONTH_NAMES = [
            "Enero", "Pebrero", "Marso", "Abril", "Mayyo", "Hunyo",
            "Hulyo", "Agosto", "Setyembre", "Oktubre", "Nobyembre", "Disyembre"
        ];

        function App() {
            const today = new Date();
            const currentMonth = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;
            const currentDate = today.toISOString().split('T')[0];
            
            const [activeTab, setActiveTab] = React.useState('talaan');
            const [selectedMonth, setSelectedMonth] = React.useState(currentMonth);
            const [selectedYear, setSelectedYear] = React.useState(today.getFullYear().toString());
            
            const [rows, setRows] = React.useState(() => 
                Array.from({ length: 31 }, () => ({ deskripsyon: '', halaga: '' }))
            );

            const [viewDate, setViewDate] = React.useState(currentDate);
            const [yearlyData, setYearlyData] = React.useState(Array(12).fill(0));
            const [syncStatus, setSyncStatus] = React.useState('Kumokonekta...');

            React.useEffect(() => {
                const docRef = db.collection('monthly_sales').doc(selectedMonth);
                const unsubscribe = docRef.onSnapshot((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        if (data.rows) setRows(data.rows);
                    } else {
                        setRows(Array.from({ length: 31 }, () => ({ deskripsyon: '', halaga: '' })));
                    }
                    setSyncStatus('Live Sync (Viewer Mode)');
                }, (err) => {
                    setSyncStatus('Error sa Koneksyon');
                });
                return () => unsubscribe();
            }, [selectedMonth]);

            React.useEffect(() => {
                const unsubscribe = db.collection('monthly_sales')
                    .onSnapshot((snapshot) => {
                        const totals = Array(12).fill(0);
                        snapshot.forEach((doc) => {
                            const docId = doc.id; 
                            if (docId.startsWith(selectedYear)) {
                                const monthIndex = parseInt(docId.split('-')[1], 10) - 1;
                                const data = doc.data();
                                if (data && data.rows && monthIndex >= 0 && monthIndex < 12) {
                                    const monthTotal = data.rows.reduce((sum, r) => {
                                        const clean = Number(String(r.halaga || '').replace(/[^0-9.-]/g, ''));
                                        return sum + (isNaN(clean) ? 0 : clean);
                                    }, 0);
                                    totals[monthIndex] = monthTotal;
                                }
                            }
                        });
                        setYearlyData(totals);
                    });
                return () => unsubscribe();
            }, [selectedYear]);

            const formatPHP = (val) => {
                if (isNaN(val) || val === '' || val === null) return '₱0';
                return new Intl.NumberFormat('fil-PH', { style: 'currency', currency: 'PHP', maximumFractionDigits: 0 }).format(val);
            };

            const parseNum = (val) => {
                if (!val) return null;
                const clean = Number(String(val).replace(/[^0-9.-]/g, ''));
                return isNaN(clean) ? null : clean;
            };

            const processedRows = React.useMemo(() => {
                let runningTotal = 0;
                return rows.map((row) => {
                    const parsed = parseNum(row.halaga);
                    if (parsed !== null) runningTotal += parsed;
                    return { ...row, parsed, balanse: runningTotal };
                });
            }, [rows]);

            // Pagsasayos para sa pagtingin ng partikular na araw sa Daily View
            const currentDayStructuredItems = React.useMemo(() => {
                if (!viewDate) return [];
                const parts = viewDate.split('-');
                if (parts.length < 3) return [];
                const d = parseInt(parts[2], 10);
                const dayIndex = d - 1;

                if (rows[dayIndex] && rows[dayIndex].deskripsyon) {
                    return rows[dayIndex].deskripsyon.split(',').map(item => {
                        const raw = item.trim();
                        if (raw.startsWith('[Bantay:')) return null;
                        const match = raw.match(/^(.*?)\s*\((\d+)\)$/);
                        if (match) {
                            return { name: match[1].trim(), price: match[2].trim() };
                        }
                        return null;
                    }).filter(i => i !== null);
                }
                return [];
            }, [viewDate, rows]);

            const currentDayBantay = React.useMemo(() => {
                if (!viewDate) return '';
                const parts = viewDate.split('-');
                if (parts.length < 3) return '';
                const d = parseInt(parts[2], 10);
                const dayIndex = d - 1;

                if (rows[dayIndex] && rows[dayIndex].deskripsyon) {
                    const found = rows[dayIndex].deskripsyon.split(',').find(i => i.trim().startsWith('[Bantay:'));
                    if (found) {
                        const mMatch = found.match(/\[Bantay:\s*(.*?)\]/);
                        if (mMatch) return mMatch[1];
                    }
                }
                return '';
            }, [viewDate, rows]);

            const totalBenta = React.useMemo(() => {
                return processedRows.reduce((acc, row) => acc + (row.parsed || 0), 0);
            }, [processedRows]);

            const grandTotalYearly = React.useMemo(() => {
                return yearlyData.reduce((acc, val) => acc + val, 0);
            }, [yearlyData]);

            const finalBalanse = processedRows.length ? processedRows[processedRows.length - 1].balanse : 0;

            const exportCSV = () => {
                let csv = `TALAAN NG BENTA (MONTHLY VIEWER),${selectedMonth}\nPetsa,Deskripsyon,Halaga,Balanse\n`;
                processedRows.forEach((r, i) => {
                    csv += `${i + 1},"${(r.deskripsyon || '').replace(/"/g, '""')}",${r.parsed || ''},${r.balanse}\n`;
                });
                csv += `TOTAL,,${totalBenta},${finalBalanse}`;

                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `talaan-benta-viewer-${selectedMonth}.csv`;
                a.click();
                URL.revokeObjectURL(url);
            };

            return (
                <div className="w-full min-h-screen bg-white p-2 sm:p-4 flex flex-col">
                    {/* Navigation Bar para sa Viewer */}
                    <div className="no-print flex justify-between items-center mb-3 pb-2 border-b border-gray-300">
                        <div className="flex gap-1.5 sm:gap-2">
                            <button onClick={() => setActiveTab('talaan')} className={`px-2.5 sm:px-3 py-1.5 font-bold text-[11px] sm:text-xs uppercase border border-black transition ${activeTab === 'talaan' ? 'bg-black text-white' : 'bg-white hover:bg-gray-100'}`}>Talaan (Monthly)</button>
                            <button onClick={() => setActiveTab('araw')} className={`px-2.5 sm:px-3 py-1.5 font-bold text-[11px] sm:text-xs uppercase border border-black transition ${activeTab === 'araw' ? 'bg-black text-white' : 'bg-white hover:bg-gray-100'}`}>Daily (Sales)</button>
                            <button onClick={() => setActiveTab('yearly')} className={`px-2.5 sm:px-3 py-1.5 font-bold text-[11px] sm:text-xs uppercase border border-black transition ${activeTab === 'yearly' ? 'bg-black text-white' : 'bg-white hover:bg-gray-100'}`}>Yearly (Record)</button>
                        </div>
                        <span className="text-[10px] sm:text-[11px] font-mono bg-green-50 text-green-800 border border-green-300 px-2 py-1 rounded font-bold">{syncStatus}</span>
                    </div>

                    {/* TAB 1: Daily Sales (READ-ONLY VIEW) */}
                    {activeTab === 'araw' && (
                        <div className="flex-1 flex flex-col gap-4">
                            <div className="pb-3 border-b-2 border-black flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                                <div>
                                    <h1 className="text-lg sm:text-2xl font-bold uppercase tracking-wide">Daily (Sales)</h1>
                                    <p className="text-[11px] text-gray-600">Pumili ng petsa para makita ang mga paninda at bantay (Viewer Mode).</p>
                                </div>
                                <div>
                                    <input type="date" value={viewDate} onChange={(e) => setViewDate(e.target.value)} className="border border-black px-3 py-1.5 text-sm font-mono bg-white outline-none" />
                                </div>
                            </div>

                            <div className="border-2 border-black p-3 bg-gray-50 flex flex-col gap-2">
                                <h2 className="font-bold text-xs uppercase tracking-wide border-b border-black pb-1.5 flex justify-between items-center">
                                    <span>📋 Listahan ({viewDate}) {currentDayBantay ? `- Bantay: ${currentDayBantay}` : '- Walang nakatalagang bantay'}</span>
                                </h2>
                                <div className="bg-white border border-black overflow-hidden">
                                    <div className="flex bg-black text-white text-[10px] font-bold uppercase px-3 py-1.5">
                                        <span className="flex-1">Paninda</span>
                                        <span className="w-24 text-right font-mono">Halaga (₱)</span>
                                    </div>
                                    <div className="flex flex-col min-h-[120px]">
                                        {currentDayStructuredItems.length > 0 ? (
                                            currentDayStructuredItems.map((item, idx) => (
                                                <div key={idx} className="flex justify-between items-center text-xs font-mono border-b border-gray-100 px-3 py-2">
                                                    <span className="flex-1 font-medium text-gray-900">{item.name}</span>
                                                    <span className="w-24 text-right font-bold text-black">₱{item.price}</span>
                                                </div>
                                            ))
                                        ) : (
                                            <div className="p-4 text-xs text-gray-400 italic">Wala pang nakatalang paninda sa petsang ito.</div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* TAB 2: TALAAN MONTHLY (READ-ONLY TABLE) */}
                    {activeTab === 'talaan' && (
                        <div className="flex-1 flex flex-col">
                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-3 border-b-2 border-black gap-2">
                                <div>
                                    <h1 className="text-lg sm:text-2xl font-bold uppercase tracking-wide">Talaan ng Benta (Monthly Viewer)</h1>
                                    <p className="text-[11px] text-gray-600">Lahat ng tala ay awtomatikong updated mula sa Bulacan (Read-Only).</p>
                                </div>
                                <div className="flex items-center gap-2">
                                    <label className="text-xs font-bold uppercase">Buwan:</label>
                                    <input type="month" value={selectedMonth} onChange={(e) => setSelectedMonth(e.target.value)} className="border border-black px-2 py-1 text-xs font-mono bg-white outline-none w-[160px]" />
                                </div>
                            </div>

                            <div className="no-print py-2 flex flex-wrap gap-2 justify-between items-center border-b border-dashed border-gray-300">
                                <div className="flex gap-1.5">
                                    <button onClick={exportCSV} className="bg-black text-white text-[11px] font-bold uppercase px-3 py-1.5 hover:bg-gray-800">I-export CSV</button>
                                    <button onClick={() => window.print()} className="border border-black text-[11px] font-bold uppercase px-3 py-1.5 hover:bg-gray-100">I-print</button>
                                </div>
                                <div className="text-xs sm:text-sm font-bold font-mono">Kabuuang Benta: {formatPHP(totalBenta)}</div>
                            </div>

                            <div className="overflow-x-auto mt-2 flex-1">
                                <table className="w-full border-collapse border border-black text-xs sm:text-sm table-fixed">
                                    <thead className="sticky top-0 bg-black text-white z-10">
                                        <tr>
                                            <th className="border border-black p-2 text-center w-[8%]">Petsa</th>
                                            <th className="border border-black p-2 text-left w-[57%]">Deskripsyon / Bantay</th>
                                            <th className="border border-black p-2 text-right w-[15%]">Halaga (PHP)</th>
                                            <th className="border border-black p-2 text-right w-[22%]">Balanse</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {processedRows.map((row, idx) => (
                                            <tr key={idx} className={idx % 2 === 0 ? 'bg-white' : 'bg-gray-50'}>
                                                <td className="border border-black p-2 text-center font-mono font-medium">{idx + 1}</td>
                                                <td className="border border-black p-2 font-mono text-gray-800 truncate select-all">{row.deskripsyon || ''}</td>
                                                <td className="border border-black p-2 text-right font-mono font-medium">{row.halaga ? formatPHP(Number(row.halaga)) : '₱0'}</td>
                                                <td className="border border-black p-2 text-right font-mono font-bold">{formatPHP(row.balanse)}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                    <tfoot>
                                        <tr className="bg-black text-white font-bold sticky bottom-0">
                                            <td colSpan="2" className="border border-black p-2 uppercase">Kabuuan</td>
                                            <td className="border border-black p-2 text-right font-mono">{formatPHP(totalBenta)}</td>
                                            <td className="border border-black p-2 text-right font-mono">{formatPHP(finalBalanse)}</td>
                                        </tr>
                                    </tfoot>
                                </table>
                            </div>
                        </div>
                    )}

                    {/* TAB 3: YEARLY SUMMARY (READ-ONLY) */}
                    {activeTab === 'yearly' && (
                        <div className="flex-1 flex flex-col">
                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-3 border-b-2 border-black gap-2">
                                <div>
                                    <h1 className="text-lg sm:text-2xl font-bold uppercase tracking-wide">Taunang Buod (Yearly Summary)</h1>
                                    <p className="text-[11px] text-gray-600">Pangkalahatang ulat sa buong taon (Read-Only).</p>
                                </div>
                                <div className="flex items-center gap-2">
                                    <label className="text-xs font-bold uppercase">Taon:</label>
                                    <select value={selectedYear} onChange={(e) => setSelectedYear(e.target.value)} className="border border-black px-2 py-1 text-xs font-mono bg-white outline-none">
                                        {[2024, 2025, 2026, 2027, 2028, 2029, 2030].map((y) => (
                                            <option key={y} value={y}>{y}</option>
                                        ))}
                                    </select>
                                </div>
                            </div>
                            <div className="my-4 p-4 border-2 border-black bg-yellow-50 flex justify-between items-center">
                                <span className="font-bold text-xs uppercase">Kabuuan para sa Taong {selectedYear}:</span>
                                <span className="font-mono font-bold text-lg">{formatPHP(grandTotalYearly)}</span>
                            </div>
                            <div className="overflow-x-auto flex-1">
                                <table className="w-full border-collapse border border-black text-xs sm:text-sm">
                                    <thead>
                                        <tr className="bg-black text-white">
                                            <th className="border border-black p-2 text-center w-16">#</th>
                                            <th className="border border-black p-2 text-left">Buwan</th>
                                            <th className="border border-black p-2 text-right">Kabuuang Benta (PHP)</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {MONTH_NAMES.map((monthName, idx) => (
                                            <tr key={idx} className={idx % 2 === 0 ? 'bg-white' : 'bg-gray-50'}>
                                                <th className="border border-black p-2 text-center font-mono font-medium">{idx + 1}</th>
                                                <td className="border border-black p-2 font-medium">{monthName}</td>
                                                <td className="border border-black p-2 text-right font-mono font-bold">{formatPHP(yearlyData[idx] || 0)}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                    <tfoot>
                                        <tr className="bg-black text-white font-bold">
                                            <td colSpan="2" className="border border-black p-3 uppercase tracking-wider">Kabuuan ng Taon</td>
                                            <td className="border border-black p-3 text-right font-mono">{formatPHP(grandTotalYearly)}</td>
                                        </tr>
                                    </tfoot>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
